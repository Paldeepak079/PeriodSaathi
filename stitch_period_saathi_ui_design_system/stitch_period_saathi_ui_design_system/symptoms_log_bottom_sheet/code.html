<style>
        .glass-sheet {
            background: rgba(253, 246, 240, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 -10px 40px rgba(135, 78, 88, 0.1);
        }
        .inner-glow {
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        .symptom-chip {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .symptom-chip-selected-lavender {
            background: linear-gradient(135deg, #eaddff 0%, #deccfd 100%);
            border-color: #secondary-fixed;
            box-shadow: 0 4px 12px rgba(101, 87, 129, 0.2);
        }
        .symptom-chip-selected-mint {
            background: linear-gradient(135deg, #cde5ff 0%, #adcded 100%);
            border-color: #tertiary-fixed;
            box-shadow: 0 4px 12px rgba(66, 97, 125, 0.2);
        }

            outline: none;
            border-color: #deccfd;
            box-shadow: 0 0 15px rgba(222, 204, 253, 0.4);
        }

<body class="bg-background font-body-md text-on-background overflow-hidden h-screen w-full relative">
<!-- Background: Period Calendar (Dimmed) -->
<div class="absolute inset-0 z-0 bg-surface-container opacity-50 flex flex-col p-container-padding-mobile">
<!-- Mock Calendar Header -->
<div class="flex justify-between items-center mb-stack-lg pt-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">March 2024</h1>
<div class="w-10 h-10 rounded-full bg-white/40 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">settings</span>
</div>
</div>
<!-- Mock Calendar Grid -->
<div class="grid grid-cols-7 gap-gutter flex-1 opacity-20">
<div class="aspect-square flex items-center justify-center font-bold">M</div>
<div class="aspect-square flex items-center justify-center font-bold">T</div>
<div class="aspect-square flex items-center justify-center font-bold">W</div>
<div class="aspect-square flex items-center justify-center font-bold">T</div>
<div class="aspect-square flex items-center justify-center font-bold">F</div>
<div class="aspect-square flex items-center justify-center font-bold">S</div>
<div class="aspect-square flex items-center justify-center font-bold">S</div>

<div class="aspect-square rounded-xl bg-white/40"></div>
<div class="aspect-square rounded-xl bg-white/40"></div>
<div class="aspect-square rounded-xl bg-primary/20 ring-2 ring-primary"></div>
<div class="aspect-square rounded-xl bg-primary/20"></div>
<div class="aspect-square rounded-xl bg-white/40"></div>
<div class="aspect-square rounded-xl bg-white/40"></div>
</div>
</div>
<!-- Backdrop Dimmer Overlay -->
<div class="absolute inset-0 bg-on-surface/30 z-10"></div>

<div class="absolute bottom-0 left-0 right-0 z-20 h-[85%] glass-sheet rounded-t-xl overflow-hidden flex flex-col">
<!-- Mascot Peeking (Brand Identity) -->
<div class="absolute -top-12 right-12 z-30 w-24 h-24 transform rotate-12 pointer-events-none">

</div>
<!-- Handle Bar -->

<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>

<div class="flex justify-between items-start">
<div>

<p class="font-label-md text-label-md text-on-secondary-fixed-variant mt-1">Today, March 14</p>
</div>
<button class="w-10 h-10 rounded-full bg-white/40 flex items-center justify-center hover:bg-white/60 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
</div>
<!-- Scrollable Body -->
<div class="flex-1 overflow-y-auto px-container-padding-mobile pb-32">

<div class="mt-stack-lg">
<h3 class="font-label-md text-label-md text-on-surface mb-stack-md">Flow Level</h3>
<div class="grid grid-cols-3 gap-gutter">
<button class="symptom-chip py-3 px-4 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-white/60">
                        Light
                    </button>
<button class="scale-105 bg-gradient-to-br from-primary-container to-primary py-3 px-4 rounded-lg font-label-md text-label-md text-white shadow-lg shadow-primary/20">
                        Medium
                    </button>
<button class="symptom-chip py-3 px-4 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-white/60">
                        Heavy
                    </button>
</div>
</div>

<div class="flex flex-wrap gap-stack-sm">
<button class="symptom-chip-selected-lavender py-2 px-5 rounded-full font-label-md text-label-md text-on-secondary-container">

<button class="symptom-chip py-2 px-5 rounded-full font-label-md text-label-md text-on-surface-variant">

                        Headache
                    </button>
<button class="symptom-chip-selected-mint py-2 px-5 rounded-full font-label-md text-label-md text-on-tertiary-container">

                    </button>
<button class="symptom-chip py-2 px-5 rounded-full font-label-md text-label-md text-on-surface-variant">
                        Back Pain
                    </button>
<button class="symptom-chip py-2 px-5 rounded-full font-label-md text-label-md text-on-surface-variant">
                        Fatigue
                    </button>
<button class="symptom-chip py-2 px-5 rounded-full font-label-md text-label-md text-on-surface-variant">
                        Acne
                    </button>
</div>
</div>
<!-- Notes Section -->
<div class="mt-stack-lg">
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="symptom-notes">Notes</label>
<div class="relative">
<textarea class="w-full rounded-lg bg-white/20 border-white/50 backdrop-blur-sm p-4 font-body-md text-body-md placeholder:text-on-surface-variant/50 input-glow transition-all" id="symptom-notes" placeholder="How's your day going?" rows="4"></textarea>
</div>
</div>
</div>

<div class="absolute bottom-0 left-0 right-0 p-container-padding-mobile bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/90 to-transparent pt-8">

</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
