<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#fcb3be",
                    "inverse-primary": "#fcb3be",
                    "on-secondary-fixed-variant": "#4d4068",
                    "on-primary-fixed": "#360c17",
                    "outline": "#847375",
                    "on-tertiary-container": "#385772",
                    "inverse-surface": "#33302c",
                    "primary-fixed": "#ffd9de",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#42617d",
                    "surface-variant": "#e8e1dc",
                    "surface-container-low": "#f9f2ec",
                    "secondary-container": "#deccfd",
                    "outline-variant": "#d6c2c3",
                    "on-primary-container": "#7b444e",
                    "on-tertiary-fixed-variant": "#2a4a64",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#eaddff",
                    "tertiary-fixed": "#cde5ff",
                    "primary": "#874e58",
                    "on-background": "#1e1b18",
                    "background": "#fff8f2",
                    "surface-container": "#f3ede7",
                    "surface-container-highest": "#e8e1dc",
                    "on-surface": "#1e1b18",
                    "inverse-on-surface": "#f6f0ea",
                    "surface-dim": "#dfd9d3",
                    "on-surface-variant": "#514345",
                    "on-primary": "#ffffff",
                    "surface-tint": "#874e58",
                    "secondary": "#655781",
                    "surface": "#fff8f2",
                    "tertiary-container": "#adcded",
                    "surface-container-lowest": "#ffffff",
                    "secondary-fixed-dim": "#d0bfef",
                    "surface-container-high": "#eee7e1",
                    "on-secondary-container": "#62547e",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#aacae9",
                    "on-primary-fixed-variant": "#6b3741",
                    "on-secondary-fixed": "#21143a",
                    "primary-container": "#ffb6c1",
                    "on-tertiary-fixed": "#001d32",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "surface-bright": "#fff8f2"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "32px",
                    "unit": "4px",
                    "stack-md": "16px",
                    "container-padding-mobile": "24px",
                    "container-padding-desktop": "48px",
                    "stack-sm": "8px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Nunito Sans"],
                    "headline-lg": ["Nunito Sans"],
                    "body-lg": ["Nunito Sans"],
                    "headline-md": ["Nunito Sans"],
                    "body-md": ["Nunito Sans"],
                    "label-md": ["Nunito Sans"],
                    "label-sm": ["Nunito Sans"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #fff8f2;
            overflow-x: hidden;
        }
        .mesh-gradient {
            background: radial-gradient(at 0% 0%, #ffb6c1 0%, transparent 50%),
                        radial-gradient(at 100% 0%, #eaddff 0%, transparent 50%),
                        radial-gradient(at 100% 100%, #cde5ff 0%, transparent 50%),
                        radial-gradient(at 0% 100%, #fff8f2 0%, transparent 50%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .shield-glow {
            filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.4));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Layer -->
<div class="fixed inset-0 mesh-gradient z-0"></div>
<!-- Content Canvas -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-between px-container-padding-mobile py-12 md:px-container-padding-desktop">
<!-- Header Section -->
<div class="w-full text-center mt-8">
<p class="font-label-md text-label-md text-primary uppercase tracking-[0.2em] mb-4">Your Body, Your Data</p>
</div>
<!-- Hero Illustration -->
<div class="flex flex-col items-center space-y-stack-lg max-w-md w-full">
<div class="glass-panel w-48 h-48 rounded-full flex items-center justify-center shadow-[0_30px_60px_-12px_rgba(135,78,88,0.15)] shield-glow relative group">
<div class="absolute inset-0 rounded-full bg-primary/5 scale-110 blur-xl opacity-50"></div>
<span class="material-symbols-outlined text-[100px] text-primary" data-icon="shield">shield</span>
</div>
<div class="text-center space-y-stack-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface leading-tight">Everything stays private</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">We prioritize your health security above all else.</p>
</div>
</div>
<!-- Features Bento-lite -->
<div class="w-full max-w-sm space-y-gutter">
<!-- Bullet Point 1 -->
<div class="glass-panel p-stack-md rounded-lg flex items-center gap-stack-md shadow-[0_8px_32px_0_rgba(135,78,88,0.05)] transform -translate-x-4">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[20px]" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface">No data sold. Ever.</span>
</div>
<!-- Bullet Point 2 -->
<div class="glass-panel p-stack-md rounded-lg flex items-center gap-stack-md shadow-[0_8px_32px_0_rgba(135,78,88,0.05)] transform translate-x-4">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined text-[20px]" data-icon="cloud_off" data-weight="fill" style="font-variation-settings: 'FILL' 1;">cloud_off</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Works completely offline</span>
</div>
<!-- Bullet Point 3 -->
<div class="glass-panel p-stack-md rounded-lg flex items-center gap-stack-md shadow-[0_8px_32px_0_rgba(135,78,88,0.05)] transform -translate-x-2">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]" data-icon="settings_accessibility" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings_accessibility</span>
</div>
<span class="font-label-md text-label-md text-on-surface">You control everything</span>
</div>
</div>
<!-- Bottom Navigation & Action -->
<div class="w-full flex flex-col items-center gap-stack-lg mt-auto">
<!-- Dot Indicators -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-on-surface-variant/20"></div>
<div class="w-6 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(135,78,88,0.4)]"></div>
<div class="w-2 h-2 rounded-full bg-on-surface-variant/20"></div>
</div>
<!-- CTA Button -->
<div class="w-full max-w-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-14 rounded-full shadow-[0_15px_30px_-8px_rgba(135,78,88,0.4)] active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2 group">
<span>Next</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Aesthetic Decorative Elements -->
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary-container/20 rounded-full blur-[100px] z-0"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[60%] h-[60%] bg-tertiary-container/20 rounded-full blur-[120px] z-0"></div>
</body></html>
