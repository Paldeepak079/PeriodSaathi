<!DOCTYPE html>

<main class="pt-24 pb-32 px-container-mobile max-w-lg mx-auto space-y-stack-lg">

<div class="space-y-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Hey Priya 🌸</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Day 3 of your cycle</p>
</div>
<div class="relative w-16 h-16 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-white/50" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-primary" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-dasharray="176" stroke-dashoffset="35" stroke-linecap="round" stroke-width="6"></circle>
</svg>

<span class="font-label-md text-label-md w-8 h-8 flex items-center justify-center">13</span>
<div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-on-error-container text-white px-2 py-0.5 rounded-full text-[10px] whitespace-nowrap glow-red">🛏 REST DAY</div>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">W</span>
<span class="font-label-md text-label-md w-8 h-8 flex items-center justify-center bg-error text-white rounded-full">14</span>
</div>
<div class="flex flex-col items-center gap-2">

</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">F</span>
<span class="font-label-md text-label-md w-8 h-8 flex items-center justify-center">16</span>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">S</span>
<div class="relative bg-tertiary-container/30 rounded-full p-0.5 glow-mint">
<span class="font-label-md text-label-md w-8 h-8 flex items-center justify-center">17</span>
<span class="material-symbols-outlined absolute -bottom-1 -right-1 text-[12px] text-tertiary" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">Sparkle</span>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">S</span>
<div class="relative bg-tertiary-container/30 rounded-full p-0.5 glow-mint">
<span class="font-label-md text-label-md w-8 h-8 flex items-center justify-center">18</span>
<span class="material-symbols-outlined absolute -bottom-1 -right-1 text-[12px] text-tertiary" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">Sparkle</span>
</div>
</div>
</div>
<!-- Mascot & Speech Bubble -->

<div class="absolute top-0 right-1/4 -mt-4 bg-white/80 border border-white px-4 py-2 rounded-2xl rounded-bl-none shadow-sm backdrop-blur-sm">

<div class="w-48 h-48">

</div>
</div>
</section>
<!-- Quick Log Row -->
<section class="space-y-stack-md">

<div class="flex gap-4 overflow-x-auto pb-4 no-scrollbar -mx-container-mobile px-container-mobile">

<span class="material-symbols-outlined text-secondary" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label-md text-label-md text-on-surface">🍽 Meals</span>
</button>
<button class="glass-card flex items-center gap-2 px-6 py-4 rounded-full min-w-max hover:bg-white/30 transition-all active:scale-95">
<span class="material-symbols-outlined text-primary" data-icon="medication" style="font-variation-settings: 'FILL' 1;">medication</span>
<span class="font-label-md text-label-md text-on-surface">💊 Medicine</span>
</button>
<button class="glass-card flex items-center gap-2 px-6 py-4 rounded-full min-w-max hover:bg-white/30 transition-all active:scale-95">
<span class="material-symbols-outlined text-error" data-icon="opacity" style="font-variation-settings: 'FILL' 1;">opacity</span>
<span class="font-label-md text-label-md text-on-surface">🩸 Flow</span>
</button>
</div>
</section>
<!-- Insights Bento Section -->
<section class="grid grid-cols-2 gap-gutter">
<div class="glass-card rounded-xl p-5 col-span-1 space-y-2">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">

</div>

<span class="material-symbols-outlined" data-icon="add">add</span>
