build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    coroutines: 2
    empty-blocks: 1
    exceptions: 1
    naming: 1
    performance: 2
    potential-bugs: 2
    style: 1

config:
  validation: true

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Composable', 'Preview']
  LargeClass:
    threshold: 600
  CyclomaticComplexity:
    threshold: 15
  LongParameterList:
    threshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInObjects: 10
    thresholdInEnums: 5

style:
  MaxLineLength:
    maxLineLength: 120
    excludeImportStatements: true
    excludeCommentStatements: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
    excludeImports: ['java.util.*', 'kotlinx.coroutines.*']
  UnusedImports:
    active: true
  ForbiddenComment:
    active: true
    comments: ['FIXME:', 'STOPSHIP:']
    allowedPatterns: ['TODO:']

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludes: ['**/*Test*', '**/*Spec*']
  ClassNaming:
    active: true
  MatchingDeclarationName:
    active: true

performance:
  SpreadOperator:
    active: true
  ForEachOnRange:
    active: true

potential-bugs:
  LateinitUsage:
    active: true
    excludeAnnotatedProperties: ['Inject', 'MockK', 'Mock']
  UnnecessarySafeCall:
    active: true

coroutines:
  SuspendFunWithFlowReturnType:
    active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  InjectDispatcher:
    active: true

exceptions:
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames: ['Exception', 'Throwable']
    allowedExceptionNameRegex: '_|(ignore|expected).*'